<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>高校英語 [論理・表現] 文法討伐クエスト</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #0b1329;
      --panel-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
      --hp-green: #22c55e;
      --hp-yellow: #eab308;
      --hp-red: #ef4444;
      --accent: #38bdf8;
      --hint: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 820px;
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .screen {
      display: none;
    }
    .screen.active {
      display: block;
    }

    /* 選択画面 */
    .title-banner {
      text-align: center;
      margin-bottom: 24px;
    }
    .title-banner h1 {
      font-size: 1.8rem;
      margin: 0 0 8px 0;
      color: var(--accent);
    }
    .stage-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 600px) {
      .stage-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .stage-card {
      background: #0f172a;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: transform 0.15s, border-color 0.15s;
    }
    .stage-card:active {
      transform: scale(0.98);
      border-color: var(--accent);
    }
    .stage-card .monster-icon {
      font-size: 2.6rem;
      flex-shrink: 0;
    }
    .stage-card-info h3 {
      margin: 0 0 4px 0;
      font-size: 1.1rem;
    }
    .stage-card-info p {
      margin: 0;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    /* バトル画面 */
    .battle-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .turn-counter {
      font-weight: 700;
      color: #fbbf24;
      font-size: 1.05rem;
    }

    .boss-area {
      text-align: center;
      margin-bottom: 20px;
    }
    .boss-avatar {
      font-size: 4.5rem;
      line-height: 1;
      margin-bottom: 8px;
      display: inline-block;
      transition: transform 0.2s;
    }
    .boss-avatar.damage {
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-4deg); }
      75% { transform: translateX(8px) rotate(4deg); }
    }
    .boss-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .hp-container {
      width: 100%;
      height: 18px;
      background: #334155;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 6px;
    }
    .hp-bar {
      height: 100%;
      width: 100%;
      background: var(--hp-green);
      transition: width 0.3s ease-in-out, background-color 0.3s;
    }
    .hp-text {
      font-size: 0.9rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .prompt-box {
      background-color: #0f172a;
      border-left: 5px solid var(--accent);
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
      position: relative;
    }
    .japanese-text {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
      line-height: 1.5;
    }

    /* ヒント枠 */
    .hint-box {
      display: none;
      background-color: #2e1065;
      border: 1px solid #7c3aed;
      color: #ddd6fe;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .hint-box.show {
      display: block;
    }

    .section-label {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .drop-zone {
      min-height: 64px;
      border: 2px dashed #475569;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      background-color: #090d16;
    }

    .sentence-end-mark {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-sub);
      padding: 0 4px;
      line-height: 1;
    }

    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 64px;
      padding: 8px;
      margin-bottom: 20px;
      background: #0f172a;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .chip {
      background-color: #1e293b;
      border: 1px solid #475569;
      color: #f8fafc;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.15rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      transition: transform 0.1s;
    }
    .chip:active {
      transform: scale(0.95);
    }
    .drop-zone .chip {
      background-color: #1d4ed8;
      border-color: #60a5fa;
    }
    .drop-zone .chip.chip-correct {
      background-color: #15803d;
      border-color: #4ade80;
    }
    .drop-zone .chip.chip-wrong {
      background-color: #b91c1c;
      border-color: #f87171;
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }
    button {
      flex: 1;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
    }
    .btn-reset {
      flex: 0 0 85px;
      background: #334155;
      color: var(--text);
    }
    .btn-hint {
      flex: 0 0 135px;
      background: var(--hint);
      color: #fff;
    }
    .btn-hint:disabled {
      background: #475569;
      color: #94a3b8;
      cursor: not-allowed;
    }

    .feedback-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .feedback-box.perfect {
      background-color: #064e3b;
      color: #a7f3d0;
      border: 1px solid #059669;
      display: block;
    }
    .feedback-box.partial {
      background-color: #713f12;
      color: #fef08a;
      border: 1px solid #ca8a04;
      display: block;
    }
    .feedback-box.miss {
      background-color: #7f1d1d;
      color: #fecaca;
      border: 1px solid #dc2626;
      display: block;
    }

    /* 結果画面 */
    .result-screen {
      text-align: center;
      padding: 30px 10px;
    }
    .result-icon {
      font-size: 5rem;
      margin-bottom: 12px;
    }
    .result-title {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .result-desc {
      font-size: 1.1rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .btn-action {
      background: var(--primary);
      color: white;
      max-width: 280px;
      margin: 0 auto;
      display: block;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- 単元選択画面 -->
  <div id="selectScreen" class="screen active">
    <div class="title-banner">
      <h1>文法討伐クエスト</h1>
      <p style="color:var(--text-sub);">討伐する敵を選択してください（各20問プールから8問ランダム出題）</p>
    </div>
    <div class="stage-grid" id="stageGrid"></div>
  </div>

  <!-- バトル画面 -->
  <div id="battleScreen" class="screen">
    <div class="battle-header">
      <span id="targetLabel" style="font-weight: 700; color: var(--accent);">Stage</span>
      <span class="turn-counter" id="turnDisplay">残り: 8問</span>
    </div>

    <div class="boss-area">
      <div class="boss-avatar" id="bossAvatar">👾</div>
      <div class="boss-name" id="bossName">Grammar Boss</div>
      <div class="hp-container">
        <div class="hp-bar" id="bossHpBar"></div>
      </div>
      <div class="hp-text" id="bossHpText">HP: 200 / 200</div>
    </div>

    <div class="prompt-box">
      <p class="japanese-text" id="jpQuestionText">日本語文</p>
    </div>

    <div class="hint-box" id="hintBox"></div>

    <div class="section-label">回答欄（文頭は自動大文字化 / タップで解除）</div>
    <div class="drop-zone" id="answerZone"></div>

    <div class="section-label">語群（小文字表示・タップして並べる）</div>
    <div class="word-bank" id="poolZone"></div>

    <div class="btn-row">
      <button class="btn-reset" id="resetBtn">リセット</button>
      <button class="btn-hint" id="hintBtn">ヒント (3)</button>
      <button class="btn-submit" id="attackBtn">攻撃する！</button>
    </div>

    <div class="feedback-box" id="feedback"></div>
  </div>

  <!-- 結果画面 -->
  <div id="resultScreen" class="screen result-screen">
    <div class="result-icon" id="resultIcon">🏆</div>
    <div class="result-title" id="resultTitle">STAGE CLEAR!</div>
    <p class="result-desc" id="resultDesc">エネミーを撃破しました！</p>
    <button class="btn-action" id="returnBtn">ステージ選択へ戻る</button>
  </div>

</div>

<script>
  // 固有名詞および代名詞 "I"（言語名・国名・人名を含む）
  const PROPER_NOUNS = new Set(["I", "Ken", "Tom", "Lucy", "Emi", "Bob", "Mike", "Mary", "English", "Japan", "Tokyo", "Paris", "London", "Canada", "Monday", "Sunday"]);

  // 各単元20問収録（計220問・高1基礎レベル4〜7語程度）
  const stageData = [
    {
      id: "tense",
      title: "時制のクロノス",
      grammar: "時制（現在・過去・進行・未来）",
      icon: "⏳",
      endMark: ".",
      questions: [
        { jp: "ケンは毎朝走る。", correct: ["Ken", "runs", "every", "morning"], hint: "三人称単数の s (runs) に注目しましょう。", exp: "日課や習慣は「現在形」で表します。" },
        { jp: "私は今、テレビを見ています。", correct: ["I", "am", "watching", "TV", "now"], hint: "<am + -ing> の順で作ります。", exp: "現在行われている動作は「現在進行形」です。" },
        { jp: "彼女は昨日、公園へ行きました。", correct: ["She", "went", "to", "the", "park", "yesterday"], hint: "go の過去形 went を使います。", exp: "過去の動作は過去形 went で表します。" },
        { jp: "彼はその時、本を読んでいました。", correct: ["He", "was", "reading", "a", "book", "then"], hint: "過去の進行形は <was + -ing> です。", exp: "過去のある瞬間の動作は「過去進行形」です。" },
        { jp: "明日雨が降るでしょう。", correct: ["It", "will", "rain", "tomorrow"], hint: "未来を表す助動詞 will を動詞の前に入れます。", exp: "未来の推測は <will + 原形> です。" },
        { jp: "私たちは今夜、テニスをする予定です。", correct: ["We", "are", "going", "to", "play", "tennis", "tonight"], hint: "<are going to + 原形> を並べます。", exp: "前からの予定は <be going to + 原形> で表現します。" },
        { jp: "もし明日晴れたら、出かけよう。", correct: ["If", "it", "is", "fine", "tomorrow", "let's", "go", "out"], hint: "if の節の中では未来のことでも現在形 is にします。", exp: "条件を表す副詞節内では未来のことでも現在形になります。" },
        { jp: "私が電話したとき、トムは寝ていた。", correct: ["Tom", "was", "sleeping", "when", "I", "called"], hint: "was sleeping の後に when 節を繋げます。", exp: "過去進行形と接続詞 when の組み合わせです。" },
        { jp: "父は毎週末、車を洗います。", correct: ["My", "father", "washes", "his", "car", "on", "weekends"], hint: "三人称単数形の washes に注意。", exp: "習慣的な動作を表す現在形です。" },
        { jp: "彼らは川で泳いでいました。", correct: ["They", "were", "swimming", "in", "the", "river"], hint: "複数主語なので were swimming です。", exp: "過去進行形 <were + -ing> です。" },
        { jp: "エミは来週、東京を訪れる予定です。", correct: ["Emi", "will", "visit", "Tokyo", "next", "week"], hint: "未来の予定を表す will visit です。", exp: "未来を表す助動詞 will です。" },
        { jp: "私たちは昨夜、音楽を聴きました。", correct: ["We", "listened", "to", "music", "last", "night"], hint: "listened to のセットを思い出しましょう。", exp: "過去の行為を表す過去形です。" },
        { jp: "彼女は今、ピアノを練習しています。", correct: ["She", "is", "practicing", "the", "piano", "now"], hint: "現在進行形 <is practicing> です。", exp: "今行われている動作は進行形にします。" },
        { jp: "太陽は東から昇ります。", correct: ["The", "sun", "rises", "in", "the", "east"], hint: "不変の真理なので現在形 rises です。", exp: "自然の摂理・真理は常に現在形です。" },
        { jp: "雨がやんだら、私たちは出発します。", correct: ["When", "it", "stops", "raining", "we", "will", "leave"], hint: "when節の中は現在形 stops にします。", exp: "時を表す副詞節内では現在形を用います。" },
        { jp: "トムは昨日、新しい靴を買いました。", correct: ["Tom", "bought", "new", "shoes", "yesterday"], hint: "buy の過去形は bought です。", exp: "不規則動詞の過去形です。" },
        { jp: "私は明日、忙しいでしょう。", correct: ["I", "will", "be", "busy", "tomorrow"], hint: "will の後ろは原形 be です。", exp: "助動詞 will + 原形 be です。" },
        { jp: "子どもたちは庭で遊んでいます。", correct: ["The", "children", "are", "playing", "in", "the", "garden"], hint: "複数名詞 children に合わせて are です。", exp: "主語とbe動詞の一致に注意した進行形です。" },
        { jp: "母が帰ってきたとき、私は料理をしていました。", correct: ["I", "was", "cooking", "when", "mother", "came", "home"], hint: "was cooking の後に when 節を続けます。", exp: "過去進行形と過去形の組み合わせです。" },
        { jp: "電車は5分後に出発します。", correct: ["The", "train", "leaves", "in", "five", "minutes"], hint: "確定した時刻表の予定は現在形 leaves で表せます。", exp: "確実な予定を表す現在形です。" }
      ]
    },
    {
      id: "perfect",
      title: "完了形のウロボロス",
      grammar: "完了形（現在・過去完了）",
      icon: "♾️",
      endMark: ".",
      questions: [
        { jp: "私は宿題を終えたところです。", correct: ["I", "have", "just", "finished", "my", "homework"], hint: "just は have と finished の間に挟みます。", exp: "「ちょうど〜した」は <have just + 過去分詞> です。" },
        { jp: "私は3年間ずっと日本に住んでいます。", correct: ["I", "have", "lived", "in", "Japan", "for", "three", "years"], hint: "have lived の後に場所・期間を並べます。", exp: "状態の継続を表す現在完了形です。" },
        { jp: "今までにその映画を見たことがありますか。", correct: ["Have", "you", "ever", "seen", "the", "movie"], hint: "Have you ever で疑問文を始めます。", exp: "経験をたずねる <Have you ever + 過去分詞 ... ?> です。" },
        { jp: "ケンは財布を失くしてしまった（今もない）。", correct: ["Ken", "has", "lost", "his", "wallet"], hint: "主語が Ken なので has lost になります。", exp: "「結果（今も手元にない）」を表す完了形です。" },
        { jp: "私たちは以前、彼に会ったことがあります。", correct: ["We", "have", "met", "him", "before"], hint: "have met の後に him を置きます。", exp: "「以前〜したことがある」という経験の用法です。" },
        { jp: "彼は2時間ずっと泳ぎ続けています。", correct: ["He", "has", "been", "swimming", "for", "two", "hours"], hint: "<has been -ing> を組み立てます。", exp: "動作の継続を表す「現在完了進行形」です。" },
        { jp: "私が着いたとき、電車はすでに出てしまっていた。", correct: ["The", "train", "had", "already", "left", "when", "I", "arrived"], hint: "過去よりも前の出来事なので had already left です。", exp: "過去の一点より前に起きたことは「過去完了 (had + 過去分詞)」です。" },
        { jp: "彼女はまだ部屋を掃除していません。", correct: ["She", "has", "not", "cleaned", "her", "room", "yet"], hint: "yet は文の最後に配置します。", exp: "現在完了の否定文では yet（まだ）を文末に置きます。" },
        { jp: "私はすでに朝食を食べました。", correct: ["I", "have", "already", "eaten", "breakfast"], hint: "already は have と eaten の間です。", exp: "完了を表す現在完了形です。" },
        { jp: "あなたは今までにパリへ行ったことがありますか。", correct: ["Have", "you", "ever", "been", "to", "Paris"], hint: "「〜へ行ったことがある」は been to です。", exp: "経験を表す <have been to 〜> です。" },
        { jp: "トムは先週からずっと病気です。", correct: ["Tom", "has", "been", "sick", "since", "last", "week"], hint: "「〜以来」は since を使います。", exp: "状態の継続を表す since の用法です。" },
        { jp: "雨は1時間ずっと降り続いています。", correct: ["It", "has", "been", "raining", "for", "an", "hour"], hint: "<has been raining> です。", exp: "現在完了進行形です。" },
        { jp: "私は一度も馬に乗ったことがありません。", correct: ["I", "have", "never", "ridden", "a", "horse"], hint: "never は have の直後に置きます。", exp: "経験の否定を表す never です。" },
        { jp: "彼女はカナダへ行ってしまった（今ここにはいない）。", correct: ["She", "has", "gone", "to", "Canada"], hint: "「行ってしまっていま居ない」は has gone to です。", exp: "完了・結果を表す <have gone to 〜> です。" },
        { jp: "私たちは子どもの頃からお互いを知っています。", correct: ["We", "have", "known", "each", "other", "since", "childhood"], hint: "know は進行形にせず have known です。", exp: "状態の継続を表す現在完了形です。" },
        { jp: "私は以前この歌を聴いたことがあります。", correct: ["I", "have", "heard", "this", "song", "before"], hint: "have heard の順です。", exp: "経験を表す用法です。" },
        { jp: "彼らはちょうど宿題を終えたところです。", correct: ["They", "have", "just", "finished", "their", "homework"], hint: "have just finished を作ります。", exp: "完了を表す用法です。" },
        { jp: "父が帰宅したとき、私はすでに寝ていました。", correct: ["I", "had", "already", "gone", "to", "bed", "when", "father", "came"], hint: "過去より前のことなので had already gone です。", exp: "過去完了形です。" },
        { jp: "彼は何回その本を読みましたか。", correct: ["How", "many", "times", "has", "he", "read", "the", "book"], hint: "How many times で疑問文を始めます。", exp: "回数を尋ねる現在完了の疑問文です。" },
        { jp: "彼女は午後からずっとピアノを弾いています。", correct: ["She", "has", "been", "playing", "the", "piano", "since", "noon"], hint: "has been playing を作ります。", exp: "動作の継続を表す現在完了進行形です。" }
      ]
    },
    {
      id: "modal",
      title: "助動詞のキメラ",
      grammar: "助動詞（基本・推量・過去の推量）",
      icon: "🦁",
      endMark: ".",

        { jp: "もし彼の電話番号を知っていれば、電話するのに。", correct: ["If", "I", "knew", "his", "number", "I", "would", "call", "him"], hint: "knew his number と would call です。", exp: "仮定法過去です。" },
        { jp: "雨が降っていなければいいのになあ。", correct: ["I", "wish", "it", "were", "not", "raining"], hint: "were not raining です。", exp: "天候への願望を表す仮定法です。" },
        { jp: "彼女はまるで幽霊を見たかのように見えます。", correct: ["She", "looks", "as", "if", "she", "saw", "a", "ghost"], hint: "as if she saw です。", exp: "as if 構文です。" },
        { jp: "君の助けがなければ、私は困るだろう。", correct: ["Without", "your", "help", "I", "would", "be", "in", "trouble"], hint: "Without your help で始めます。", exp: "Without の仮定表現です。" }
      ]
    }
  ];

  const BOSS_MAX_HP = 200;
  const MAX_TURNS = 8;
  const MAX_HINTS = 3;

  let currentStage = null;
  let currentHp = BOSS_MAX_HP;
  let remainingTurns = MAX_TURNS;
  let remainingHints = MAX_HINTS;
  let questionIdx = 0;
  let sessionQuestions = [];

  let answerTokens = [];
  let poolTokens = [];

  // DOM
  const selectScreen = document.getElementById("selectScreen");
  const battleScreen = document.getElementById("battleScreen");
  const resultScreen = document.getElementById("resultScreen");

  const stageGrid = document.getElementById("stageGrid");
  const targetLabel = document.getElementById("targetLabel");
  const turnDisplay = document.getElementById("turnDisplay");
  const bossAvatar = document.getElementById("bossAvatar");
  const bossName = document.getElementById("bossName");
  const bossHpBar = document.getElementById("bossHpBar");
  const bossHpText = document.getElementById("bossHpText");

  const jpQuestionText = document.getElementById("jpQuestionText");
  const hintBox = document.getElementById("hintBox");
  const answerZone = document.getElementById("answerZone");
  const poolZone = document.getElementById("poolZone");
  const attackBtn = document.getElementById("attackBtn");
  const resetBtn = document.getElementById("resetBtn");
  const hintBtn = document.getElementById("hintBtn");
  const feedback = document.getElementById("feedback");

  const resultIcon = document.getElementById("resultIcon");
  const resultTitle = document.getElementById("resultTitle");
  const resultDesc = document.getElementById("resultDesc");
  const returnBtn = document.getElementById("returnBtn");

  function shuffle(arr) {
    const res = [...arr];
    for (let i = res.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [res[i], res[j]] = [res[j], res[i]];
    }
    return res;
  }

  // 表示用フォーマット（生徒の画面に見せる文字）
  function formatDisplayWord(rawWord, isSentenceStart) {
    // 固有名詞や代名詞 "I" は常に大文字
    for (let proper of PROPER_NOUNS) {
      if (proper.toLowerCase() === rawWord.toLowerCase()) {
        return proper;
      }
    }
    // 文頭なら先頭を大文字化
    if (isSentenceStart) {
      return rawWord.charAt(0).toUpperCase() + rawWord.slice(1).toLowerCase();
    }
    return rawWord.toLowerCase();
  }

  function isStartOfSentence(pos, currentQ) {
    if (pos === 0) return true;
    if (currentQ && typeof currentQ.middlePeriodIndex === "number") {
      if (pos === currentQ.middlePeriodIndex + 1) {
        return true;
      }
    }
    return false;
  }

  function initStageGrid() {
    stageGrid.innerHTML = "";
    stageData.forEach(stage => {
      const card = document.createElement("div");
      card.className = "stage-card";
      card.innerHTML = `
        <div class="monster-icon">${stage.icon}</div>
        <div class="stage-card-info">
          <h3>${stage.title}</h3>
          <p>${stage.grammar}</p>
        </div>
      `;
      card.addEventListener("click", () => startBattle(stage));
      stageGrid.appendChild(card);
    });
  }

  function startBattle(stage) {
    currentStage = stage;
    currentHp = BOSS_MAX_HP;
    remainingTurns = MAX_TURNS;
    remainingHints = MAX_HINTS;
    questionIdx = 0;

    // 20問プールから8問をランダム抽出
    sessionQuestions = shuffle(stage.questions).slice(0, MAX_TURNS);

    bossAvatar.textContent = stage.icon;
    bossName.textContent = stage.title;
    targetLabel.textContent = `TARGET: ${stage.grammar}`;

    updateHpUi();
    updateTurnUi();
    updateHintBtnUi();

    selectScreen.classList.remove("active");
    resultScreen.classList.remove("active");
    battleScreen.classList.add("active");

    loadTurn();
  }

  function updateHpUi() {
    const percent = Math.max(0, Math.ceil((currentHp / BOSS_MAX_HP) * 100));
    bossHpBar.style.width = percent + "%";
    bossHpText.textContent = `HP: ${currentHp} / ${BOSS_MAX_HP}`;

    if (percent > 50) {
      bossHpBar.style.backgroundColor = "var(--hp-green)";
    } else if (percent > 20) {
      bossHpBar.style.backgroundColor = "var(--hp-yellow)";
    } else {
      bossHpBar.style.backgroundColor = "var(--hp-red)";
    }
  }

  function updateTurnUi() {
    turnDisplay.textContent = `残り問題数: ${remainingTurns}問`;
  }

  function updateHintBtnUi() {
    hintBtn.textContent = `ヒント (${remainingHints})`;
    hintBtn.disabled = remainingHints <= 0;
  }

  function loadTurn() {
    feedback.className = "feedback-box";
    feedback.innerHTML = "";
    hintBox.className = "hint-box";
    hintBox.innerHTML = "";
    attackBtn.textContent = "攻撃する！";

    const q = sessionQuestions[questionIdx];
    jpQuestionText.textContent = q.jp;

    answerTokens = [];
    poolTokens = shuffle(q.correct.map((word, id) => ({ id, rawText: word })));
    renderTokens();
  }

  function renderTokens(evaluation = null) {
    const q = sessionQuestions[questionIdx];
    answerZone.innerHTML = "";

    answerTokens.forEach((tok, pos) => {
      const chip = document.createElement("div");
      chip.className = "chip";

      // 画面表示は文頭大文字化・固有名詞を整形
      const isStart = isStartOfSentence(pos, q);
      chip.textContent = formatDisplayWord(tok.rawText, isStart);

      if (evaluation) {
        if (evaluation.posCorrect[pos]) {
          chip.classList.add("chip-correct");
        } else {
          chip.classList.add("chip-wrong");
        }
      }

      chip.addEventListener("click", () => {
        if (attackBtn.textContent === "次の問題へ") return;
        const [removed] = answerTokens.splice(pos, 1);
        poolTokens.push(removed);
        renderTokens();
      });

      answerZone.appendChild(chip);

      if (q && typeof q.middlePeriodIndex === "number" && pos === q.middlePeriodIndex) {
        const midMark = document.createElement("span");
        midMark.className = "sentence-end-mark";
        midMark.textContent = ".";
        answerZone.appendChild(midMark);
      }
    });

    const endMark = document.createElement("span");
    endMark.className = "sentence-end-mark";
    endMark.textContent = currentStage.endMark || ".";
    answerZone.appendChild(endMark);

    // 語群レンダリング（全小文字）
    poolZone.innerHTML = "";
    poolTokens.forEach((tok, pos) => {
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.textContent = tok.rawText.toLowerCase();
      chip.addEventListener("click", () => {
        if (attackBtn.textContent === "次の問題へ") return;
        const [removed] = poolTokens.splice(pos, 1);
        answerTokens.push(removed);
        renderTokens();
      });
      poolZone.appendChild(chip);
    });
  }

  resetBtn.addEventListener("click", () => {
    if (attackBtn.textContent === "次の問題へ") return;
    const q = sessionQuestions[questionIdx];
    answerTokens = [];
    poolTokens = shuffle(q.correct.map((word, id) => ({ id, rawText: word })));
    renderTokens();
  });

  hintBtn.addEventListener("click", () => {
    if (remainingHints <= 0) return;
    if (hintBox.classList.contains("show")) return;

    const q = sessionQuestions[questionIdx];
    remainingHints--;
    updateHintBtnUi();

    hintBox.innerHTML = `💡 <strong>ヒント:</strong> ${q.hint || "主語と動詞の並びに注目しましょう。"}`;
    hintBox.classList.add("show");
  });

  // 最長共通部分列 (LCS) 計算（小文字正規化して比較）
  function computeLcsLength(arr1, arr2) {
    const m = arr1.length;
    const n = arr2.length;
    const dp = Array.from({ length: m + 1 }, () => Array(n + 1).fill(0));

    for (let i = 0; i < m; i++) {
      for (let j = 0; j < n; j++) {
        if (arr1[i].toLowerCase() === arr2[j].toLowerCase()) {
          dp[i + 1][j + 1] = dp[i][j] + 1;
        } else {
          dp[i + 1][j + 1] = Math.max(dp[i + 1][j], dp[i][j + 1]);
        }
      }
    }
    return dp[m][n];
  }

  function buildCorrectDisplay(q) {
    let res = "";
    q.correct.forEach((w, idx) => {
      res += w;
      if (typeof q.middlePeriodIndex === "number" && idx === q.middlePeriodIndex) {
        res += ". ";
      } else if (idx < q.correct.length - 1) {
        res += " ";
      }
    });
    return res + (currentStage.endMark || ".");
  }

  // 攻撃・解答判定
  attackBtn.addEventListener("click", () => {
    if (attackBtn.textContent === "次の問題へ") {
      questionIdx++;
      loadTurn();
      return;
    }

    const q = sessionQuestions[questionIdx];
    const totalWords = q.correct.length;

    if (answerTokens.length === 0) {
      alert("単語をタップして並べてから攻撃してください！");
      return;
    }

    remainingTurns--;
    updateTurnUi();

    // 【修正点】攻撃の判定ロジックではすべて小文字(toLowerCase)に正規化して比較
    // これにより english / English 等の大文字小文字の差異による不正解を完全に排除
    const userWordsRaw = answerTokens.map(t => t.rawText);
    const correctWords = q.correct;

    const posCorrect = userWordsRaw.map((w, idx) => {
      if (!correctWords[idx]) return false;
      return w.toLowerCase() === correctWords[idx].toLowerCase();
    });

    // 模範解答に合わせてユーザー解答の表示文字列を完全補正（English等）
    answerTokens.forEach((tok, idx) => {
      if (posCorrect[idx]) {
        tok.rawText = correctWords[idx];
      }
    });

    let exactMatches = 0;
    userWordsRaw.forEach((w, i) => {
      if (correctWords[i] && w.toLowerCase() === correctWords[i].toLowerCase()) {
        exactMatches++;
      }
    });

    const lcsMatches = computeLcsLength(userWordsRaw, correctWords);
    const effectiveMatches = Math.max(exactMatches, lcsMatches);
    const accuracyRatio = effectiveMatches / totalWords;

    // 完全一致判定（小文字ベース）
    const isFullMatch = userWordsRaw.length === totalWords &&
      userWordsRaw.every((w, idx) => w.toLowerCase() === correctWords[idx].toLowerCase());

    let damage = 0;
    if (isFullMatch) {
      damage = 40;
    } else {
      damage = Math.round(accuracyRatio * 30);
    }

    if (damage > 0) {
      currentHp = Math.max(0, currentHp - damage);
      updateHpUi();
      bossAvatar.classList.add("damage");
      setTimeout(() => bossAvatar.classList.remove("damage"), 400);
    }

    renderTokens({ posCorrect });

    const correctSentence = buildCorrectDisplay(q);
    if (damage >= 38) {
      feedback.className = "feedback-box perfect";
      feedback.innerHTML = `<strong>CRITICAL HIT!【完全一致】</strong> 敵に <strong>${damage}</strong> の特大ダメージ！<br>${q.exp}`;
    } else if (damage > 0) {
      feedback.className = "feedback-box partial";
      feedback.innerHTML = `<strong>HIT!【部分命中】</strong> 語順の部分一致により <strong>${damage}</strong> のダメージ！<br>正解：<code>${correctSentence}</code><br>${q.exp}`;
    } else {
      feedback.className = "feedback-box miss";
      feedback.innerHTML = `<strong>MISS!【攻撃不発】</strong> 語順が大きく異なっています。<br>正解：<code>${correctSentence}</code><br>${q.exp}`;
    }

    if (currentHp <= 0) {
      setTimeout(() => showResult(true), 1000);
      return;
    }
    if (remainingTurns <= 0) {
      setTimeout(() => showResult(false), 1000);
      return;
    }

    attackBtn.textContent = "次の問題へ";
  });

  function showResult(isWin) {
    battleScreen.classList.remove("active");
    resultScreen.classList.add("active");

    if (isWin) {
      resultIcon.textContent = "🏆";
      resultTitle.textContent = "MISSION COMPLETE!";
      resultTitle.style.color = "#4ade80";
      resultDesc.textContent = `${currentStage.title} を討伐しました！\n文法事項「${currentStage.grammar}」の基礎がしっかり身についています。`;
    } else {
      resultIcon.textContent = "💀";
      resultTitle.textContent = "QUEST FAILED";
      resultTitle.style.color = "#f87171";
      resultDesc.textContent = `規定問題数（${MAX_TURNS}問）を終了しましたが、敵のHPが残ってしまいました。\nヒントや解説を確認して再挑戦してみましょう！`;
    }
  }

  returnBtn.addEventListener("click", () => {
    resultScreen.classList.remove("active");
    selectScreen.classList.add("active");
  });

  initStageGrid();
</script>
